                  type: object
                assessment:
                  type: object
                clinical_note:
                  type: [string, 'null']
                treatment_plan:
                  type: [string, 'null']
                follow_up_at:
                  type: [string, 'null']
                follow_up_notes:
                  type: [string, 'null']
