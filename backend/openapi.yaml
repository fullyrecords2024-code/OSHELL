                  type: string
                  minLength: 3
                  maxLength: 3
                is_available:
                  type: boolean
                is_public:
                  type: boolean
                deposit_policy:
                  type: string
                  enum: [pay_at_clinic, fixed, full]
                deposit_amount:
                  type: number
                booking_lead_hours:
                  type: integer
                cancellation_notice_hours:
                  type: integer
