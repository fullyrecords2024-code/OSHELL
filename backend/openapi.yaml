openapi: 3.1.0
info:
  title: Oshel Clinic API
  version: 2.0.0
  description: >
    Organization, identity, customer, clinical, HR/payroll, inventory, procurement,
    point-of-sale, e-commerce, service, appointment, queue, and marketing APIs.
    Business endpoints require a verified account, a changed temporary password,
    and the relevant permission within the user's organization and branch scope.
servers:
  - url: http://localhost:8000/api/v1
security:
  - bearerAuth: []
paths:
  /public/enquiries:
    post:
      security: []
      summary: Submit a public customer enquiry
      description: Rate-limited intake. Requires explicit permission to contact and an email address or phone number; do not submit clinical information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_slug, name, subject, contact_consent]
              properties:
                organization_slug:
                  type: string
                  maxLength: 120
                branch_id:
                  type: [integer, 'null']
                name:
                  type: string
                  maxLength: 180
                email:
                  type: [string, 'null']
                  format: email
                  maxLength: 255
                phone:
                  type: [string, 'null']
                  maxLength: 40
                subject:
                  type: string
                  maxLength: 180
                message:
                  type: [string, 'null']
                  maxLength: 2000
                contact_consent:
                  type: boolean
                  const: true
                utm_source:
                  type: [string, 'null']
                  maxLength: 160
                utm_medium:
                  type: [string, 'null']
                  maxLength: 160
                utm_campaign:
                  type: [string, 'null']
                  maxLength: 160
                utm_content:
                  type: [string, 'null']
                  maxLength: 160
                utm_term:
                  type: [string, 'null']
                  maxLength: 160
                referrer:
                  type: [string, 'null']
                  format: uri
                  maxLength: 500
                landing_page:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '201':
          description: Enquiry recorded
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Public enquiry rate limit exceeded
  /crm/overview:
    get:
      summary: Read the CRM workspace overview
      description: Returns tenant/branch-scoped leads, tasks, campaigns, segments, expenses, team members, and conversion attribution. Requires crm.view.
      responses:
        '200':
          description: CRM overview without clinical records
          content:
            application/json:
              schema:
                type: object
  /crm/leads:
    post:
      summary: Create a staff-managed CRM lead
      description: Requires crm.leads.manage and applicable organization/branch scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Lead created
        '422':
          $ref: '#/components/responses/ValidationError'
  /crm/leads/{lead}:
    patch:
      summary: Update a CRM lead
      parameters:
        - in: path
          name: lead
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Lead updated
        '404':
          description: Lead not found in the actor's organization
  /crm/leads/{lead}/conversions:
    post:
      summary: Link a lead to a completed business conversion
      description: A conversion must reference an eligible booking, paid online order, or completed POS sale for the same customer.
      parameters:
        - in: path
          name: lead
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Conversion recorded
        '422':
          $ref: '#/components/responses/ValidationError'
  /crm/segments:
    post:
      summary: Save a consent-aware customer segment
      description: Supported criteria are limited to branch, lead source, and marketing-consent state; clinical attributes are not available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Segment saved
  /crm/segments/{segment}/members:
    get:
      summary: List customers matching a saved segment
      parameters:
        - in: path
          name: segment
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Scoped segment members
  /crm/teams:
    post:
      summary: Create a marketing team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Team created
  /crm/teams/{team}/members:
    put:
      summary: Replace marketing team membership
      parameters:
        - in: path
          name: team
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Team membership updated
  /crm/tasks:
    post:
      summary: Create a branch-scoped CRM task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Task created
  /crm/tasks/{task}:
    patch:
      summary: Update a CRM task
      parameters:
        - in: path
          name: task
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Task updated
  /crm/campaigns:
    post:
      summary: Create a draft marketing campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Draft campaign created
  /crm/campaigns/{campaign}/submit:
    post:
      summary: Submit a campaign for approval
      parameters:
        - in: path
          name: campaign
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Campaign submitted
  /crm/campaigns/{campaign}/approve:
    post:
      summary: Approve a submitted campaign and budget
      parameters:
        - in: path
          name: campaign
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Campaign approved by an independent reviewer
  /crm/campaigns/{campaign}/status:
    patch:
      summary: Update an approved campaign's lifecycle state
      parameters:
        - in: path
          name: campaign
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Campaign status updated
  /crm/expenses:
    post:
      summary: Submit a marketing expense
      description: Campaign expenses are checked against the approved budget and currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Expense submitted for review
  /crm/expenses/{expense}/review:
    post:
      summary: Approve or reject a submitted marketing expense
      parameters:
        - in: path
          name: expense
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Expense decision recorded by an independent reviewer
  /crm/customers/{customer}/preferences:
    put:
      summary: Update a customer's marketing preference
      parameters:
        - in: path
          name: customer
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Preference state and consent history updated
  /portal/marketing-preferences:
    get:
      summary: Read the signed-in customer's marketing preferences
      description: Returns only the authenticated customer's email, SMS, and WhatsApp marketing preference states.
      responses:
        '200':
          description: Customer-owned marketing preference states
    put:
      summary: Update the signed-in customer's marketing preference
      description: Records an append-only consent event. Opt-in requires a matching email address or phone number on the customer profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, status]
              properties:
                channel:
                  type: string
                  enum: [email, sms, whatsapp]
                status:
                  type: string
                  enum: [opted_in, opted_out]
                consent_text_version:
                  type: [string, 'null']
                  maxLength: 40
      responses:
        '200':
          description: Customer-owned preference updated
        '422':
          $ref: '#/components/responses/ValidationError'
  /marketing/external-campaigns:
    get:
      summary: Read branch-scoped external campaign snapshots
      description: Campaign metrics are manually entered and are not synchronized with provider APIs.
      responses:
        '200':
          description: Manual campaign snapshots and activity logs
    post:
      summary: Import an external campaign snapshot manually
      description: Requires marketing.campaigns.manage. No external provider synchronization is performed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, name, status]
              properties:
                branch_id:
                  type: [integer, 'null']
                platform:
                  type: string
                  enum: [google, meta, tiktok, whatsapp]
                name:
                  type: string
                  maxLength: 180
                status:
                  type: string
                  enum: [externally_managed, paused, ended, sync_pending, sync_failed]
                spend_amount:
                  type: [number, 'null']
                impressions:
                  type: [integer, 'null']
                clicks:
                  type: [integer, 'null']
                conversions:
                  type: [integer, 'null']
      responses:
        '201':
          description: Manual snapshot created
        '422':
          $ref: '#/components/responses/ValidationError'
  /marketing/external-campaigns/{campaign}/metrics:
    put:
      summary: Record updated manual campaign metrics
      description: Requires marketing.campaigns.manage and branch access. Does not synchronize with the provider.
      parameters:
        - in: path
          name: campaign
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                spend_amount:
                  type: [number, 'null']
                impressions:
                  type: [integer, 'null']
                clicks:
                  type: [integer, 'null']
                conversions:
                  type: [integer, 'null']
      responses:
        '200':
          description: Manual metrics snapshot updated and audited
        '404':
          description: Campaign is outside the caller organization
        '422':
          $ref: '#/components/responses/ValidationError'
  /analytics/dashboard:
    get:
      summary: Read permission-filtered business analytics
      description: Returns organization/branch-scoped aggregate metrics only for domains the caller is authorized to view. Clinical results contain workflow counts only; no patient, employee, or customer-level records are returned.
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: branch_id
          schema:
            type: integer
      responses:
        '200':
          description: Aggregated metrics with sources, definitions, date basis, and applicable permission labels
        '403':
          description: Analytics permission is required
        '404':
          description: Branch is outside the caller scope
        '422':
          $ref: '#/components/responses/ValidationError'
  /analytics/export:
    get:
      summary: Export authorized analytics as CSV
      description: Requires analytics.view and analytics.export. The export request is recorded in the audit log.
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: branch_id
          schema:
            type: integer
      responses:
        '200':
          description: CSV export containing only authorized aggregate metrics and lineage
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Analytics export permission is required
        '404':
          description: Branch is outside the caller scope
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      security: []
      summary: Sign in and issue a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device_name:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Authenticated user and Sanctum token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_type:
                    type: string
                    const: Bearer
                  access_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      summary: Revoke the current bearer token
      responses:
        '200':
          description: Current token revoked
  /auth/logout-all:
    post:
      summary: Revoke all of the current user's bearer tokens
      responses:
        '200':
          description: All tokens revoked
  /auth/me:
    get:
      summary: Get the authenticated user's identity and access scope
      responses:
        '200':
          description: User, roles, permissions, and branch assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
  /auth/sessions:
    get:
      summary: List the authenticated user's API sessions
      responses:
        '200':
          description: User-owned personal access tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiSession'
  /auth/sessions/{tokenId}:
    delete:
      summary: Revoke one of the authenticated user's sessions
      parameters:
        - in: path
          name: tokenId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Session revoked
  /auth/password/forgot:
    post:
      security: []
      summary: Request password reset instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Generic response that does not disclose account existence
  /auth/password/reset:
    post:
      security: []
      summary: Reset a password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password reset and existing API sessions revoked
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password:
    put:
      summary: Change the authenticated user's password
      responses:
        '200':
          description: Password updated and existing API sessions revoked
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/email/verify/{id}/{hash}:
    get:
      security: []
      summary: Verify an email address using a signed link
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: hash
          required: true
          schema:
            type: string
        - in: query
          name: expires
          required: true
          schema:
            type: integer
        - in: query
          name: signature
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email address verified
        '403':
          description: Invalid or expired verification link
  /auth/email/verification-notification:
    post:
      summary: Resend the authenticated user's verification link
      responses:
        '200':
          description: Verification notification sent or address already verified
  /users:
    get:
      summary: List users in the authenticated user's organization
      responses:
        '200':
          description: Paginated organization-scoped users
    post:
      summary: Provision a user with roles and branch assignments
      responses:
        '201':
          description: User created and onboarding notifications sent
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/{user}:
    get:
      summary: Get a same-organization user
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update user profile, status, roles, or branch assignments
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User updated
        '422':
          $ref: '#/components/responses/ValidationError'
  /roles:
    get:
      summary: List configured roles and permissions
      responses:
        '200':
          description: Roles and permissions available to administrators
  /audit-events:
    get:
      summary: Search organization-scoped audit events
      responses:
        '200':
          description: Filtered audit event list
  /overview:
    get:
      summary: Get an organization- or assignment-scoped foundation overview
      responses:
        '200':
          description: Foundation summary; branch-only users receive assigned branch data
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    oneOf:
                      - $ref: '#/components/schemas/Organization'
                      - type: 'null'
                  stats:
                    type: object
                    additionalProperties:
                      type: integer
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
                  departments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
        '403':
          description: The account lacks organization.view and branch.view permissions
  /organizations:
    get:
      summary: List organizations
      responses:
        '200':
          description: Organization list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '422':
          $ref: '#/components/responses/ValidationError'
  /organizations/{organization}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: Get an organization
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Soft-delete an organization with no active children or assigned users
      responses:
        '204':
          description: Organization soft-deleted
        '409':
          description: Organization still has branches, departments, or assigned users
  /branches:
    get:
      summary: List branches
      parameters:
        - in: query
          name: organization_id
          schema:
            type: integer
        - in: query
          name: is_active
          schema:
            type: boolean
      responses:
        '200':
          description: Branch list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
    post:
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '422':
          $ref: '#/components/responses/ValidationError'
  /branches/{branch}:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    get:
      summary: Get a branch
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '409':
          description: Branch cannot be moved while it has assigned departments or users
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Soft-delete a branch without assigned departments or users
      responses:
        '204':
          description: Branch soft-deleted
        '409':
          description: Branch still has assigned departments or users
  /departments:
    get:
      summary: List departments
      parameters:
        - in: query
          name: organization_id
          schema:
            type: integer
        - in: query
          name: branch_id
          schema:
            oneOf:
              - type: integer
              - type: 'null'
        - in: query
          name: is_active
          schema:
            type: boolean
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
    post:
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '422':
          $ref: '#/components/responses/ValidationError'
  /departments/{department}:
    parameters:
      - $ref: '#/components/parameters/DepartmentId'
    get:
      summary: Get a department
      responses:
        '200':
          description: Department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Soft-delete a department
      responses:
        '204':
          description: Department soft-deleted
  /customers:
    get:
      summary: Search customers in the caller's organization and branch scope
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Paginated customer identities; patient fields are permission filtered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Register a customer, optionally with a patient profile or portal account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                email:
                  type: [string, 'null']
                  format: email
                phone:
                  type: [string, 'null']
                preferred_channel:
                  type: string
                  enum: [email, sms, phone, whatsapp, none]
                registration_source:
                  type: string
                  enum: [walk_in, referral, website, phone, other]
                branch_id:
                  type: [integer, 'null']
                is_patient:
                  type: boolean
                patient:
                  type: object
                  additionalProperties: true
                activate_portal:
                  type: boolean
      responses:
        '201':
          description: Customer registered
        '409':
          description: Possible duplicate; includes duplicate_customer for review
        '422':
          $ref: '#/components/responses/ValidationError'
  /customers/{customer}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      summary: Get a customer and authorized history/consents
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update customer contact details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
