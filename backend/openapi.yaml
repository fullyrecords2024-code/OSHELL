        '422':
          $ref: '#/components/responses/ValidationError'
  /branch-business-hours:
    get:
      summary: Get business hours for an authorized branch
      parameters:
        - in: query
          name: branch_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Weekly business-hour records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, branch_id, day_of_week, is_closed]
                  properties:
                    id:
                      type: integer
                    branch_id:
                      type: integer
                    day_of_week:
                      type: integer
                      minimum: 0
                      maximum: 6
                    is_closed:
                      type: boolean
                    opens_at:
                      type: [string, 'null']
                      format: time
                    closes_at:
                      type: [string, 'null']
                      format: time
        '403':
          description: The caller lacks branch access or schedules.manage
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      summary: Replace business hours for a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, hours]
              properties:
                branch_id:
                  type: integer
                hours:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: object
                    required: [day_of_week, is_closed]
                    properties:
                      day_of_week:
                        type: integer
                        minimum: 0
                        maximum: 6
                      is_closed:
                        type: boolean
                      opens_at:
                        type: [string, 'null']
                        format: time
                      closes_at:
                        type: [string, 'null']
                        format: time
      responses:
        '200':
          description: Seven business-hour records saved
        '422':
          $ref: '#/components/responses/ValidationError'
