        '422':
          $ref: '#/components/responses/ValidationError'
  /service-categories:
    post:
      summary: Create an organization-scoped service category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: [string, 'null']
      responses:
        '201':
          description: Category created
        '422':
          $ref: '#/components/responses/ValidationError'
  /services/{service}/branches:
    put:
